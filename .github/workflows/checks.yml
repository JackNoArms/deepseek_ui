name: Python smoke checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python source
        run: python -m compileall -q src testes

      - name: Run deterministic smoke tests
        run: |
          python -m pytest testes/test_caminhos.py testes/test_push.py testes/test_remote.py testes/test_remote_ui.py testes/test_remote_a11y.py testes/test_skills.py -q
